<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Marta Tegegne Mamo">
    <!-- project description to enhance SEO -->
    <meta name="description" content="Designed to help you handle your multiple tasks">
    <title>Project Manager</title>
    <!-- css external link attached here -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <!-- header -->
        <h1>Task Manager</h1>
        <!-- form  -->
        <form id="todo-form">
            <input type="hidden" id="task-id">
            <label for="title">Task Title: </label>
            <input type="text" id="title" placeholder="Task Title" required>
            <label for="description">Task description: </label>
            <textarea id="description" placeholder="Description"></textarea>
            <div class="form-row">
                <label for="category">Category:</label>
                <select id="category">
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Education">Education</option>
                </select>
                <label for="dueDate">Due Date:</label>
                <input type="date" id="dueDate" required>
            </div>
            <button type="submit" id="submit-btn">Add Task</button>
        </form>

        <hr>
<!-- my app filters  -->
        <div class="filters">
            <button onclick="fetchTasks()">All</button>
            <button onclick="fetchTasks('Work')">Work</button>
            <button onclick="fetchTasks('Personal')">Personal</button>
            <button onclick="fetchTasks('Education')">Education</button>
        </div>
<!-- a place holder for the add or updated task in UI  -->
        <div id="task-list">
            </div>
            <!-- darkmode contianer -->
            <div class="theme-switch">
                
    <button id="theme-toggle" >🌙 Toggle Dark Mode</button>
</div>
    </div>
    <!-- the edit button  -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2>Edit Task</h2>
            <div id="modal-form-container"></div>
        </div>
    </div>
    <!-- the external js attached here -->
    <script src="./script.js"></script>
</body>
</html>
