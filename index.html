<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="author" content="Marta Tegegne Mamo">
     <!-- project description to enhance SEO -->
     <meta name="description" content="Designed to help you handle your mutliple tasks">
    <title>project Manager</title>
    <!-- the external styling sheet link goes here -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Task Manager</h1>
        
        <form id="todo-form">
            <input type="text" id="title" placeholder="Task Title" required>
            <textarea id="description" placeholder="Description"></textarea>
            <div class="form-row">
              <!--  -->
              <label for="category"> Choose a category</label>
                <select id="category" >
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Education">Education</option>
                </select>
                <label for="dueDate">Due Date:</label>
                <input type="date" id="dueDate" required>
            </div>
            <!-- submit button -->
            <button type="submit">Add Task</button>
        </form>

        <hr>
<!-- important buttons go here  -->
        <div class="filters">
            <button onclick="fetchTasks()">All</button>
            <button onclick="fetchTasks('Work')">Work</button>
            <button onclick="fetchTasks('Personal')">Personal</button>
            <button onclick="fetchTasks('Education')">Education</button>
        </div>
<!--  -->
        <div id="task-list"></div>
    </div>
    <!-- the project js file link goes here -->
    <script src="script.js"></script>
</body>
</html>
